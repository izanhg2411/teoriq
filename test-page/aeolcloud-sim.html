    `<i class="fa fa-check${showCheck(k) ? '' : ' ng-hide'}"></i>` +
    `<i class="fa fa-times${showTimes(k) ? '' : ' ng-hide'}"></i>` +
    `<span class="texto-respuesta">${t}</span></div>`).join('') + '</div>';
}

function render() {
  $('imgslot').innerHTML = QUESTIONS[i].img ? '<img class="imagewrapper" src="data:image/png;base64, ' + PNG + '" alt="Red dot">' : '';
  if ($('recreate').checked || !host.firstChild) host.innerHTML = html();
  else { // actualización "in situ": solo cambian las clases de los iconos
    const tmp = document.createElement('div'); tmp.innerHTML = html();
    host.querySelectorAll('.fa').forEach((el, n) => { el.className = tmp.querySelectorAll('.fa')[n].className; });
  }
  $('counter').textContent = `Pregunta ${i + 1} de ${QUESTIONS.length}`;
}
host.addEventListener('click', (e) => {
  const a = e.target.closest('.answer');
  if (!a || answered) return;
  selected = +a.dataset.k;
  setTimeout(() => { // la corrección llega después de responder, como en AEOLCLOUD
    answered = true; window.__checkReady = !$('slow').checked; render();
    if ($('slow').checked) setTimeout(() => { window.__checkReady = true; render(); }, 250);
  }, 120);
});
$('next').addEventListener('click', () => { i = (i + 1) % QUESTIONS.length; selected = null; answered = false; window.__checkReady = false; render(); });
// Angular compila la plantilla un instante después de cargar
host.innerHTML = '<div class="question"><h2 class="configsize">{{currentTest.pregunta}}</h2></div>';
setTimeout(render, 150);
</script>
